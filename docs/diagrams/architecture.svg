<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1030" viewBox="0 0 1360 1030">
<title>Short URL Microservices — Architecture Diagram</title>
<desc>Browser and QR visitor access React Frontend on Vercel; same-origin rewrites route to API Gateway and independent Auth, Link and Analytics Express services on Vercel; each uses its own schema and database role in one Supabase PostgreSQL instance.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#667990"/></marker>
<style>
text{font-family:"Segoe UI",Arial,sans-serif;fill:#192f49}
.title{font-size:29px;font-weight:700}.sub{font-size:16px;fill:#62758a}.group{font-size:17px;font-weight:700;letter-spacing:.3px}
.name{font-size:20px;font-weight:700}.small{font-size:14px;fill:#5a7087}.tag{font-size:13px;font-weight:600}
.line{stroke:#73889e;stroke-width:2.4;fill:none;marker-end:url(#arr)}.dash{stroke:#8899a9;stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#arr)}
</style>
</defs>
<rect width="1360" height="1030" fill="#f5f8fc"/>
<text x="60" y="65" class="title">SHORT URL — MICROSERVICES ARCHITECTURE</text>
<text x="60" y="94" class="sub">Deployment topology · React / Express / Prisma / PostgreSQL · Vercel + Supabase</text>
<rect x="65" y="124" width="570" height="107" rx="18" fill="#fff" stroke="#c4cfdd" stroke-width="2"/>
<text x="350" y="163" class="name" text-anchor="middle">User / Browser</text><text x="350" y="188" class="small" text-anchor="middle">Login · Create · QR · History · Statistics</text>
<rect x="725" y="124" width="570" height="107" rx="18" fill="#fff" stroke="#c4cfdd" stroke-width="2"/>
<text x="1010" y="163" class="name" text-anchor="middle">Visitor / QR Scanner</text><text x="1010" y="188" class="small" text-anchor="middle">GET /:code (new) or GET /s/:code (legacy)</text>
<rect x="64" y="275" width="1231" height="148" rx="18" fill="#eaf3fe" stroke="#98bee8" stroke-width="2"/>
<text x="90" y="309" class="group">VERCEL · FRONTEND PROJECT</text>
<rect x="93" y="325" width="495" height="72" rx="12" fill="white" stroke="#74a9db" stroke-width="2"/>
<text x="340" y="352" class="name" text-anchor="middle">React + Vite SPA</text><text x="340" y="374" class="small" text-anchor="middle">Client interface / fetch API</text>
<rect x="716" y="325" width="530" height="72" rx="12" fill="white" stroke="#74a9db" stroke-width="2"/>
<text x="981" y="352" class="name" text-anchor="middle">Same-origin Rewrites</text><text x="981" y="374" class="small" text-anchor="middle">/api/* · /:code · /s/:code</text>
<path d="M350 231V325" class="line"/><path d="M1010 231V325" class="line"/>
<path d="M588 360H716" class="line"/>
<text x="652" y="350" class="tag" text-anchor="middle">/api</text>
<rect x="64" y="470" width="1231" height="339" rx="18" fill="#f0faf6" stroke="#9fd1bc" stroke-width="2"/>
<text x="90" y="505" class="group">VERCEL · EXPRESS BACKEND PROJECTS</text>
<rect x="432" y="526" width="496" height="93" rx="13" fill="#e5f4ff" stroke="#48a0d3" stroke-width="2.5"/>
<text x="680" y="563" class="name" text-anchor="middle">API Gateway</text><text x="680" y="587" class="small" text-anchor="middle">Routing · Origin guard · Session check · Rate limit</text>
<path d="M981 397V443H680V526" class="line"/><text x="852" y="449" class="tag">HTTPS rewrite</text>
<rect x="102" y="691" width="343" height="91" rx="13" fill="white" stroke="#43a585" stroke-width="2"/>
<rect x="509" y="691" width="343" height="91" rx="13" fill="white" stroke="#43a585" stroke-width="2"/>
<rect x="916" y="691" width="343" height="91" rx="13" fill="white" stroke="#43a585" stroke-width="2"/>
<text x="273" y="725" class="name" text-anchor="middle">Auth Service</text><text x="273" y="749" class="small" text-anchor="middle">Users · Sessions · Profile</text>
<text x="680" y="725" class="name" text-anchor="middle">Link Service</text><text x="680" y="749" class="small" text-anchor="middle">Short URLs · QR · Redirect · History</text>
<text x="1088" y="725" class="name" text-anchor="middle">Analytics Service</text><text x="1088" y="749" class="small" text-anchor="middle">Click Events · Counts · Statistics</text>
<path d="M550 619V649H273V691" class="line"/>
<path d="M680 619V691" class="line"/>
<path d="M810 619V649H1088V691" class="line"/>
<text x="105" y="657" class="tag">HTTPS + internal secret to every service</text>
<path d="M445 759H509" class="dash"/><path d="M852 759H916" class="dash"/>
<text x="477" y="681" class="tag" text-anchor="middle">Verify session</text>
<text x="884" y="681" class="tag" text-anchor="middle">Visits / Counts</text>
<rect x="64" y="844" width="1231" height="139" rx="18" fill="#fff8ec" stroke="#dfbd7c" stroke-width="2"/>
<text x="91" y="874" class="group">SUPABASE · ONE POSTGRESQL INSTANCE · 3 OWNED SCHEMAS / ROLES</text>
<rect x="99" y="893" width="347" height="67" rx="11" fill="#fff" stroke="#d6ad60" stroke-width="2"/>
<rect x="506" y="893" width="347" height="67" rx="11" fill="#fff" stroke="#d6ad60" stroke-width="2"/>
<rect x="913" y="893" width="347" height="67" rx="11" fill="#fff" stroke="#d6ad60" stroke-width="2"/>
<text x="273" y="920" class="name" text-anchor="middle">app_auth</text><text x="273" y="941" class="small" text-anchor="middle">users · sessions · rate_limits</text>
<text x="680" y="920" class="name" text-anchor="middle">app_links</text><text x="680" y="941" class="small" text-anchor="middle">links · rate_limits</text>
<text x="1088" y="920" class="name" text-anchor="middle">app_analytics</text><text x="1088" y="941" class="small" text-anchor="middle">click_events</text>
<path d="M273 782V893" class="line"/><path d="M680 782V893" class="line"/><path d="M1088 782V893" class="line"/>
<text x="329" y="833" class="tag">Prisma / auth_owner</text><text x="713" y="833" class="tag">Prisma / links_owner</text><text x="1110" y="833" class="tag">Prisma / analytics_owner</text>
<text x="680" y="1010" class="small" text-anchor="middle">Logical cross-service IDs are not physical foreign keys · Environment shown is target deployment architecture</text>
</svg>