name: shortly-microservices
x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile.backend
  restart: unless-stopped
  init: true
  networks: [private]
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:'+process.env.PORT+'/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 15s
    timeout: 4s
    retries: 5
    start_period: 30s
x-environment: &environment
  NODE_ENV: development
  HOST: 0.0.0.0
  APP_URL: ${APP_URL:?Run npm run setup first}
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Required}
  AUTH_SERVICE_URL: http://auth:3001
  LINK_SERVICE_URL: http://links:3002
  ANALYTICS_SERVICE_URL: http://analytics:3003
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: short_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Required}
      POSTGRES_DB: short_url
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Required}
      LINK_DB_PASSWORD: ${LINK_DB_PASSWORD:?Required}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Required}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5544}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./infra/postgres-init.sql:/opt/bootstrap.sql:ro
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U short_admin -d short_url"]
      interval: 5s
      timeout: 3s
      retries: 30
  auth:
    <<: *backend
    command:
      [
        "sh",
        "-c",
        "npm run migrate -w services/auth-service && npm start -w services/auth-service",
      ]
    environment:
      <<: *environment
      PORT: 3001
      DATABASE_URL: postgresql://auth_owner:${AUTH_DB_PASSWORD}@postgres:5432/short_url?schema=app_auth
      DIRECT_URL: postgresql://auth_owner:${AUTH_DB_PASSWORD}@postgres:5432/short_url?schema=app_auth
    depends_on: { postgres: { condition: service_healthy } }
  links:
    <<: *backend
    command:
      [
        "sh",
        "-c",
        "npm run migrate -w services/link-service && npm start -w services/link-service",
      ]
    environment:
      <<: *environment
      PORT: 3002
      DATABASE_URL: postgresql://links_owner:${LINK_DB_PASSWORD}@postgres:5432/short_url?schema=app_links
      DIRECT_URL: postgresql://links_owner:${LINK_DB_PASSWORD}@postgres:5432/short_url?schema=app_links
    depends_on:
      {
        postgres: { condition: service_healthy },
        auth: { condition: service_healthy },
      }
  analytics:
    <<: *backend
    command:
      [
        "sh",
        "-c",
        "npm run migrate -w services/analytics-service && npm start -w services/analytics-service",
      ]
    environment:
      <<: *environment
      PORT: 3003
      DATABASE_URL: postgresql://analytics_owner:${ANALYTICS_DB_PASSWORD}@postgres:5432/short_url?schema=app_analytics
      DIRECT_URL: postgresql://analytics_owner:${ANALYTICS_DB_PASSWORD}@postgres:5432/short_url?schema=app_analytics
    depends_on:
      {
        postgres: { condition: service_healthy },
        auth: { condition: service_healthy },
      }
  gateway:
    <<: *backend
    command: ["npm", "start", "-w", "gateway"]
    environment: { <<: *environment, PORT: 3000 }
    healthcheck:
      {
        test:
          [
            "CMD",
            "node",
            "-e",
            "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1))",
          ],
        interval: 15s,
        timeout: 4s,
        retries: 5,
      }
    depends_on:
      {
        auth: { condition: service_healthy },
        links: { condition: service_healthy },
        analytics: { condition: service_healthy },
      }
  frontend:
    build: { context: ., dockerfile: Dockerfile.frontend }
    ports: ["127.0.0.1:5173:80"]
    networks: [private, public]
    depends_on: [gateway]
    restart: unless-stopped
networks:
  private: { internal: true }
  public: {}
volumes:
  postgres-data: {}
