server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 32k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  location /api/ { proxy_pass http://gateway:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For ""; proxy_read_timeout 15s; }
  location /s/ { proxy_pass http://gateway:3000; proxy_set_header Host $host; proxy_read_timeout 15s; }
  location = /healthz { proxy_pass http://gateway:3000; }
  include /etc/nginx/short-links.conf;
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
